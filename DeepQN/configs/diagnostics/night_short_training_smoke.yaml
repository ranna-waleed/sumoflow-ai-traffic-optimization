schema: sumoflow-exploratory-training-diagnostic-v1
classification: nonpublication_uncalibrated_synthetic_diagnostic
base_config: ../dqn_config.yaml
profile: night
episodes: 1
training_seed: 41001
sumo_seed: 41002
traci_port: 18813
wall_clock_timeout_s: 900
output_root: ../../diagnostics/phase3_exploratory_night
overrides:
  simulation:
    sumo_binary: sumo
    step_length: 1
    decision_interval: 10
    terminate_on_empty: false
    research_evaluation: true
    comparative_research: false
    require_matched_forecast_warmup: false
    physical_trace_mode: research_fail_closed
    lane_observation_mode: research_fail_closed
    waiting_time_memory_s: 100
  bilstm:
    mode: no_forecast
    history_warmup_seconds: 0
    initial_control_protocol: null
  training:
    num_episodes: 1
    checkpoint_freq: 1
  state:
    observation_contract: sumoflow-dqn-observation-v3-lane-occupancy-fraction
  dqn:
    min_replay_size: 64
  profiles:
    night:
      end: 80100
