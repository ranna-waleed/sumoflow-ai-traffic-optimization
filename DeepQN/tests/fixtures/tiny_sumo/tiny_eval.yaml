simulation:
  net_file: DeepQN/tests/fixtures/tiny_sumo/tiny.net.xml
  add_file: DeepQN/tests/fixtures/tiny_sumo/tiny.add.xml
  step_length: 1
  decision_interval: 5
  terminate_on_empty: false
  sumo_binary: sumo
profiles:
  tiny:
    config: DeepQN/tests/fixtures/tiny_sumo/tiny.sumocfg
    begin: 0
    end: 40
tls_junctions:
  center:
    green_phases: [0, 2]
    green_to_yellow: {"0": 1, "2": 3}
    yellow_to_next: {"1": 2, "3": 0}
    yellow_duration: 3
    min_green: 2
    max_green: 20
    incoming_lanes: [n_in_0, s_in_0, e_in_0, w_in_0]
state:
  max_lanes: 10
  features_per_lane: 3
  state_dim: 37
  max_queue: 10
  max_wait: 40
  max_phase_elapsed: 40
bilstm:
  use_real_model: false
  max_flow_per_edge: 10
reward:
  wait_time_weight: 1.0
  co2_weight: 0.001
  throughput_weight: 0.5
  pressure_weight: 0.0
dqn:
  state_dim: 37
  action_dim: 2
  hidden_dims: [8]
  batch_size: 2
  min_replay_size: 2
